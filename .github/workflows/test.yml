name: selftest
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is tested by hand for now: in Nov 2026 GitHub's hosted macOS arm64 runners
        # were not picking up jobs. Add macos-latest back to this list to restore it.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pillow numpy imageio-ffmpeg
      - name: Self test
        run: python scripts/selftest.py
